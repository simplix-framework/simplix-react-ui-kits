packages:
  - packages/*
  - testing/*

# The versions a product consuming these kits resolves. A product that adds the kits to its own
# workspace resolves `catalog:` from its own catalog instead, so these entries keep the kits
# buildable on their own and must match what the products pin.
catalog:
  '@storybook/react': 10.2.19
  storybook: 10.2.19
  # What a mockup root runs its Storybook and captures with; the framework's own versions.
  vite: 8.0.0
  playwright: 1.64.1
  react-router-dom: 7.13.1
  msw: ^2.12.12
  zod: ^4.3.6
  '@simplix-react/headless': 0.3.7
  simplix-react: 0.3.7
  simplix-react-ext: 0.3.7
  '@fontsource/noto-sans-jp': ^5.2.9
  '@fontsource/noto-sans-kr': ^5.2.9
  '@tanstack/react-query': ^5.90.21
  '@tanstack/react-router': ^1.167.4
  '@testing-library/react': ^16.3.2
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  jsdom: ^29.0.0
  lucide-react: ^1.34.0
  oxlint: ^1.56.0
  react: ^19.2.4
  tw-animate-css: ^1.4.0
  # The Tailwind a design kit compiles its stylesheet with, the framework's own, so a kit's
  # compiled design and the framework's are written by one compiler.
  tailwindcss: 4.2.1
  '@tailwindcss/node': 4.2.1
  react-dom: ^19.2.4
  tsup: ^8.5.1
  typescript: ^5.9.3
  vitest: ^4.1.0
  zustand: ^5.0.12

onlyBuiltDependencies:
  - esbuild
