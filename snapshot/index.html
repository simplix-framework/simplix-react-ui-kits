<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SimpliX React UI Kits Documentation</title>
  <meta name="description" content="simplix-react-ui-kits - UI kits for simplix-react products: screen parts, screen templates and mockup tooling">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="keywords" content="simplix-react, UI kit, React, screen templates, mockup, Storybook">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>S</text></svg>">

  <!-- Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">

  <!-- Prism syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism-tomorrow.min.css">

  <style>
    :root {
      --theme-color: #7c3aed;
    }

    /* Korean font optimization */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    /* Sidebar styling */
    .sidebar {
      padding-left: 20px;
    }

    .sidebar-nav li {
      margin: 6px 0;
    }

    .app-sub-sidebar {
      margin-left: 1em;
    }

    /* Code block styling */
    .markdown-section code {
      border-radius: 4px;
    }

    .markdown-section pre {
      border-radius: 8px;
    }

    /* Table styling */
    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section th {
      background-color: #f8f8f8;
    }

    .markdown-section img {
      max-width: 100%;
    }

    /* Link to the source of a page */
    .page-source {
      text-align: right;
      font-size: 0.9em;
    }

    .page-source a {
      color: #999;
    }

    /* Cover page styling */
    section.cover {
      background: linear-gradient(to bottom, #c4b5fd 0%, #c4b5fd 50%, #ffffff 100%) !important;
      background-color: #c4b5fd !important;
    }

    section.cover.show {
      background: linear-gradient(to bottom, #c4b5fd 0%, #c4b5fd 50%, #ffffff 100%) !important;
    }

    .cover-main {
      background: transparent !important;
    }

    section.cover h1 {
      color: #5b21b6 !important;
    }

    section.cover p {
      color: #4c1d95 !important;
    }

    section.cover ul li {
      color: #4c1d95 !important;
    }

    section.cover .cover-main > p:last-child a {
      border-radius: 4px;
      color: #fff !important;
      border-color: #7c3aed;
      background-color: #7c3aed;
    }

    section.cover .cover-main > p:last-child a:hover {
      background-color: #6d28d9;
    }

    section.cover a.github-corner {
      fill: #7c3aed !important;
    }

    /* Search styling */
    .search input {
      border-radius: 4px;
    }
  </style>
<link rel="stylesheet" href="assets/version-selector.css">
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: '<img src="https://img.shields.io/badge/SimpliX-UI_Kits-7c3aed?style=for-the-badge" alt="SimpliX React UI Kits">',
      nameLink: '#/',
      repo: 'https://github.com/simplix-framework/simplix-react-ui-kits',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      noEmoji: true,
      themeColor: '#7c3aed',

      // The site opens in the first language (relative paths, so a version folder can hold it)
      homepage: 'en/README.md',

      // One sidebar per language and one navbar, whatever folder a page is in
      alias: {
        '/ko/.*/_sidebar.md': 'ko/_sidebar.md',
        '/ko/_sidebar.md': 'ko/_sidebar.md',
        '/.*/_sidebar.md': 'en/_sidebar.md',
        '/.*/_navbar.md': '_navbar.md'
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/ko/': '검색...',
          '/en/': 'Search...',
          '/': 'Search...'
        },
        noData: {
          '/ko/': '결과 없음',
          '/en/': 'No results',
          '/': 'No results'
        },
        depth: 3,
        namespace: 'simplix-react-ui-kits-docs-' + window.location.pathname.replace(/index\.html$/, ''),
        pathNamespaces: ['/en', '/ko']
      },

      pagination: {
        previousText: 'Prev',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      },

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },

      plugins: [
        // The texts of the page follow the language of the page
        function(hook, vm) {
          var i18n = {
            ko: {
              pagination: { previousText: '이전', nextText: '다음' },
              copyCode: { buttonText: '복사', errorText: '오류', successText: '완료' }
            },
            en: {
              pagination: { previousText: 'Prev', nextText: 'Next' },
              copyCode: { buttonText: 'Copy', errorText: 'Error', successText: 'Copied' }
            }
          };

          function getLang(path) {
            return path && path.indexOf('/ko/') === 0 ? 'ko' : 'en';
          }

          hook.init(function() {
            var texts = i18n[getLang(window.location.hash.replace('#', ''))];
            window.$docsify.pagination.previousText = texts.pagination.previousText;
            window.$docsify.pagination.nextText = texts.pagination.nextText;
            window.$docsify.copyCode.buttonText = texts.copyCode.buttonText;
            window.$docsify.copyCode.errorText = texts.copyCode.errorText;
            window.$docsify.copyCode.successText = texts.copyCode.successText;
          });

          hook.doneEach(function() {
            var lang = getLang(vm.route.path);
            var texts = i18n[lang];
            document.documentElement.lang = lang;
            // The label of each link, not its title, which is the name of the page it leads to
            var prevBtn = document.querySelector('.pagination-item--previous .pagination-item-label span');
            var nextBtn = document.querySelector('.pagination-item--next .pagination-item-label span');
            if (prevBtn) prevBtn.textContent = texts.pagination.previousText;
            if (nextBtn) nextBtn.textContent = texts.pagination.nextText;
          });
        }
      ]
    }
  </script>

  <!-- Version selector -->
<script src="assets/version-selector.js"></script>
<!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-jsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-tsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-ini.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-http.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-handlebars.min.js"></script>
</body>
</html>
